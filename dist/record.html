<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EkList · Live demo recorder</title><style>body{margin:0;background:#111114;color:white;font:15px system-ui}header{padding:12px 20px;display:flex;align-items:center;gap:16px}button,a{background:#ac3042;color:white;border:0;border-radius:8px;padding:10px 18px;font:inherit}iframe{width:100%;height:calc(100vh - 70px);border:0}#status{flex:1}a[hidden]{display:none}body.recording header{display:none}body.recording iframe{height:100vh}</style><header><b>EkList · Live recording</b><button id="start">Start recording</button><button id="stop" disabled>Stop & save</button><span id="status">Choose this browser tab when asked. Recording stays on your device.</span><a id="download" hidden>Download video</a></header><iframe src="/" title="Live EkList workspace" allow="clipboard-write"></iframe><script>
let recorder,stream,chunks=[],url;const start=document.querySelector('#start'),stop=document.querySelector('#stop'),status=document.querySelector('#status'),download=document.querySelector('#download');
start.onclick=async()=>{try{if(!navigator.mediaDevices?.getDisplayMedia)throw Error('Screen capture is unavailable in this browser. Open this page in Chrome or Edge.');stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false,preferCurrentTab:true});chunks=[];const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{document.body.classList.remove('recording');stream.getTracks().forEach(t=>t.stop());if(url)URL.revokeObjectURL(url);const video=new Blob(chunks,{type:recorder.mimeType});url=URL.createObjectURL(video);if(['localhost','127.0.0.1'].includes(location.hostname)){try{const saved=await fetch('/api/demo-recording',{method:'POST',headers:{'Content-Type':recorder.mimeType},body:video});if(!saved.ok)throw Error('Save failed');status.textContent='Recording saved directly to the local demo folder.';}catch(e){status.textContent='Save failed; keep this tab open and use Download video.';}}download.href=url;download.download='EkList-live-demo.'+(recorder.mimeType.includes('mp4')?'mp4':'webm');download.hidden=false;if(!['localhost','127.0.0.1'].includes(location.hostname))status.textContent='Recording complete. Download the original continuous video.';start.disabled=false;stop.disabled=true};stream.getVideoTracks()[0].onended=()=>{if(recorder.state!=='inactive')recorder.stop()};document.body.classList.add('recording');recorder.start(1000);setTimeout(()=>{if(recorder?.state==='recording')recorder.stop()},120000);start.disabled=true;stop.disabled=false;download.hidden=true;status.textContent='● Recording continuously — run queries, inspect evidence and download CSVs below.'}catch(e){status.textContent=e.message}};stop.onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
</script></html>
